name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pinned components
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MSSR/requirements.txt

      - name: Install lightweight dependencies
        working-directory: MSSR
        run: python -m pip install -r requirements.txt

      - name: Validate shell entry points
        run: |
          bash -n setup.sh run.sh MSSR/pipeline.sh
          ./setup.sh --help

      - name: Run unit tests
        working-directory: MSSR
        run: python -m unittest discover -v

      - name: Validate pipeline wiring
        run: ./run.sh all --mode xonly --dry-run
